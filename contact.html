<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>
            Contact | VivasayaMart
        </title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header class="header">
            <div class="container navbar">
                <a class="logo" href="index.html">
                    🌿 VivasayaMart
                </a>
                <nav>
                    <a href="index.html">
                        Home
                    </a>
                    <a href="products.html">
                        Products
                    </a>
                    <a href="about.html">
                        About
                    </a>
                    <a class="active" href="contact.html">
                        Contact
                    </a>
                </nav>
                <div class="nav-actions">
                    <a href="cart.html">
                        🛒
                        <span id="cartCount">
                            0
                        </span>
                    </a>
                </div>
            </div>
        </header>
        <main>
            <section class="section">
                <div class="container contact-layout">
                    <div>
                        <p class="eyebrow">
                            GET IN TOUCH
                        </p>
                        <h1>
                            How can we help?
                        </h1>
                        <p>
                            Have a question about a product or order? Send us a message.
                        </p>
                        <div class="contact-item">
                            📧 support@vivasayamart.com
                        </div>
                        <div class="contact-item">
                            📞 +91 98765 43210
                        </div>
                        <div class="contact-item">
                            📍 Chennai, Tamil Nadu
                        </div>
                    </div>
                    <form id="contactForm" class="form-card">
                        <label>
                            Name
                            <input required>
                        </label>
                        <label>
                            Email
                            <input type="email" required>
                        </label>
                        <label>
                            Subject
                            <input required>
                        </label>
                        <label>
                            Message
                            <textarea required>
                            </textarea>
                        </label>
                        <button class="btn primary" type="submit">
                            Send Message
                        </button>
                        <p id="contactMessage" class="message">
                        </p>
                    </form>
                </div>
            </section>
        </main>
        <footer class="footer">
            <div class="copyright">
                © 2026 VivasayaMart
            </div>
        </footer>
        <script src="js/main.js">
        </script>
        <script src="js/auth.js">
        </script>
    </body>
</html>
