<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>
            Register | VivasayaMart
        </title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="auth-page">
            <div class="auth-card">
                <a class="logo" href="index.html">
                    🌿 VivasayaMart
                </a>
                <h1>
                    Create Account
                </h1>
                <p>
                    Join our farming community.
                </p>
                <form id="registerForm">
                    <label>
                        Full Name
                        <input id="regName" required>
                    </label>
                    <label>
                        Email
                        <input id="regEmail" type="email" required>
                    </label>
                    <label>
                        Password
                        <input id="regPassword" type="password" minlength="6" required>
                    </label>
                    <label>
                        Confirm Password
                        <input id="regConfirm" type="password" required>
                    </label>
                    <button class="btn primary full" type="submit">
                        Register
                    </button>
                </form>
                <p id="registerMessage" class="message">
                </p>
                <p>
                    Already registered?
                    <a href="login.html">
                        Login
                    </a>
                </p>
            </div>
        </div>
        <script src="js/auth.js">
        </script>
    </body>
</html>
